<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Original gold dragon illustration">
  <defs>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f3b00"/>
      <stop offset="38%" stop-color="#8a5a00"/>
      <stop offset="70%" stop-color="#b67a12"/>
      <stop offset="100%" stop-color="#efc35a"/>
    </linearGradient>

    <linearGradient id="bellyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff2cc"/>
    </linearGradient>

    <radialGradient id="orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7b0"/>
      <stop offset="100%" stop-color="#d28a1e"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a4a00" flood-opacity="0.2"/>
    </filter>

    <pattern id="scales" width="26" height="24" patternUnits="userSpaceOnUse">
      <path d="M2,22 C7,6 19,6 24,22" fill="none" stroke="#f5da96" stroke-width="1.4"/>
      <path d="M5,22 C10,10 16,10 21,22" fill="none" stroke="#8a5a00" stroke-width="1" opacity="0.75"/>
    </pattern>

    <path id="dragonCurve" d="M770,220
      C1030,330 1040,580 760,690
      C480,800 360,620 520,480
      C700,320 880,500 820,680
      C760,850 540,980 400,1080
      C280,1160 230,1280 360,1360
      C500,1440 770,1380 900,1260"/>

    <path id="bellyCurve" d="M740,250
