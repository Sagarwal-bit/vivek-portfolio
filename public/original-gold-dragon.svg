    <use href="#dragonCurve" fill="none" stroke="url(#scales)" stroke-width="130" stroke-linecap="round" opacity="0.9"/>
    <use href="#bellyCurve" fill="none" stroke="url(#bellyFill)" stroke-width="70" stroke-linecap="round" opacity="0.95"/>

