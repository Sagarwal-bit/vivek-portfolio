<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fantasy Dragon Hero - Vivek Sagarwal</title>
  <style>
    :root {
      --bg-top: #090b16;
      --bg-mid: #0f1630;
      --bg-bottom: #0a101f;
      --text: #eef2ff;
      --muted: #a6b0d8;
      --accent: #76e4ff;
      --accent-2: #8af3c9;
      --btn-bg: linear-gradient(125deg, #71ddff, #8af3c9);
      --btn-text: #061724;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", "Inter", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 0%, #1d2548 0%, var(--bg-top) 38%, var(--bg-bottom) 100%);
    }

    .hero-root {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 22%, rgba(132, 168, 255, 0.18), transparent 38%),
        radial-gradient(circle at 78% 24%, rgba(86, 223, 255, 0.08), transparent 26%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 42%, var(--bg-bottom));
    }

    #scene {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 2rem;
    }

    .hero-content {
      pointer-events: auto;
      text-align: center;
      max-width: min(880px, 92vw);
      backdrop-filter: blur(2px);
    }

    .title {
      margin: 0;
      line-height: 1.06;
      letter-spacing: 0.02em;
      font-size: clamp(2rem, 5.6vw, 4.4rem);
      text-wrap: balance;
      text-shadow:
        0 0 10px rgba(131, 211, 255, 0.18),
        0 0 28px rgba(94, 139, 255, 0.14);
    }

    .subtitle {
      margin: 1rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.3rem);
      max-width: 54ch;
      text-wrap: balance;
    }

    .cta {
      margin-top: 1.7rem;
      border: 0;
      border-radius: 999px;
      padding: 0.78rem 1.35rem;
      font-weight: 700;
      font-size: 0.97rem;
      color: var(--btn-text);
      background: var(--btn-bg);
      box-shadow: 0 12px 32px rgba(118, 228, 255, 0.3);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(138, 243, 201, 0.34);
    }

    .hint {
      margin-top: 0.85rem;
      font-size: 0.78rem;
      color: rgba(191, 202, 244, 0.8);
    }

    @media (max-width: 700px) {
      .hero-overlay {
        padding: 1.25rem;
      }

      .subtitle {
        line-height: 1.5;
      }

      .cta {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <section class="hero-root" aria-label="Fantasy portfolio hero section">
    <div id="scene" aria-hidden="true"></div>

    <div class="hero-overlay">
      <div class="hero-content">
        <h1 class="title">Vivek Sagarwal - Full Stack Developer</h1>
        <p class="subtitle">Building intelligent web experiences</p>
        <button class="cta" type="button">View Projects</button>
        <div class="hint">Tip: Move the mouse to influence dragon flight and camera parallax.</div>
      </div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';

    // Use your own animated dragon model for best realism.
    // If this URL fails due to CORS/network, place model at ./models/dragon.glb and update path.
    const DRAGON_MODEL_URL =
      'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DragonAttenuation/glTF-Binary/DragonAttenuation.glb';

    const mount = document.getElementById('scene');

    // Core Three.js setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b1120, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 1.4, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    // Lighting for cinematic fantasy look
    const ambient = new THREE.AmbientLight(0x8fa7d9, 0.58);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffd9a1, 1.9);
    key.position.set(6, 8, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 40;
    key.shadow.camera.left = -14;
    key.shadow.camera.right = 14;
    key.shadow.camera.top = 14;
    key.shadow.camera.bottom = -14;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x72b2ff, 1.2);
    rim.position.set(-9, 5, -8);
    scene.add(rim);

    // Ground receives dragon shadow (subtle visible plane)
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.ShadowMaterial({ opacity: 0.26 })
    );
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = -2.3;
    ground.receiveShadow = true;
    scene.add(ground);

    // Particle field for fantasy atmosphere
    const particleCount = 1800;
    const particleGeometry = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i += 1) {
      const i3 = i * 3;
      particlePositions[i3] = (Math.random() - 0.5) * 85;
      particlePositions[i3 + 1] = Math.random() * 30 - 7;
      particlePositions[i3 + 2] = (Math.random() - 0.5) * 85;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

    const particles = new THREE.Points(
      particleGeometry,
      new THREE.PointsMaterial({
        color: 0x9cc8ff,
        size: 0.06,
        transparent: true,
        opacity: 0.7,
        depthWrite: false,
      })
    );
    scene.add(particles);

    // Dragon objects and animation helpers
    const dragonRig = new THREE.Group();
    scene.add(dragonRig);

    let dragonModel = null;
    let mixer = null;
    let wingBones = [];

    const clock = new THREE.Clock();
    const loader = new GLTFLoader();

    // Find potential wing bones for procedural flap fallback
    function collectWingBones(root) {
      const left = [];
      const right = [];

      root.traverse((obj) => {
        if (!obj.name) return;
        const name = obj.name.toLowerCase();
        if (name.includes('wing') || name.includes('arm')) {
          if (name.includes('l') || name.includes('left')) left.push(obj);
          if (name.includes('r') || name.includes('right')) right.push(obj);
        }
      });

      wingBones = { left, right };
    }

    function stylizeDragonMaterials(root) {
      root.traverse((obj) => {
        if (!obj.isMesh) return;
        obj.castShadow = true;
        obj.receiveShadow = true;

        if (obj.material) {
          obj.material.metalness = Math.min(1, (obj.material.metalness ?? 0.2) + 0.12);
          obj.material.roughness = Math.max(0.16, (obj.material.roughness ?? 0.62) - 0.2);
          if (obj.material.color) {
            obj.material.color.offsetHSL(0.06, 0.12, 0.08);
          }
        }
      });
    }

    // Load GLB/GLTF dragon
    loader.load(
      DRAGON_MODEL_URL,
      (gltf) => {
        dragonModel = gltf.scene;
        dragonModel.scale.setScalar(2.2);
        dragonModel.position.set(0, 0, 0);
        dragonModel.rotation.y = Math.PI;

        stylizeDragonMaterials(dragonModel);
        collectWingBones(dragonModel);
        dragonRig.add(dragonModel);

        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(dragonModel);
          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.setLoop(THREE.LoopRepeat);
            action.play();
          });
        }
      },
      undefined,
      () => {
        // Fallback: still keeps hero functional if model URL is blocked
        const fallbackMesh = new THREE.Mesh(
          new THREE.TorusKnotGeometry(1.2, 0.28, 220, 36),
          new THREE.MeshStandardMaterial({
            color: 0xd39b2f,
            emissive: 0x2b1a05,
            metalness: 0.85,
            roughness: 0.24,
          })
        );
        fallbackMesh.castShadow = true;
        fallbackMesh.receiveShadow = true;
        dragonRig.add(fallbackMesh);
      }
    );

    // Mouse interaction data
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    window.addEventListener('pointermove', (event) => {
      mouse.targetX = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -((event.clientY / window.innerHeight) * 2 - 1);
    }, { passive: true });

    // Hero orbit center (where heading visually sits)
    const titleCenter = new THREE.Vector3(0, 1.1, 0);

    // Animation modes: orbit + occasional fly-by
    function updateDragonMotion(elapsed) {
      const cycle = 14.0;
      const phase = (elapsed % cycle) / cycle;

      let x;
      let y;
      let z;
      let yaw;

      if (phase < 0.68) {
        // Circular orbit around hero text
        const t = phase / 0.68;
        const angle = t * Math.PI * 2;
        const rx = 5.8;
        const rz = 3.7;

        x = titleCenter.x + Math.cos(angle) * rx;
        y = titleCenter.y + Math.sin(elapsed * 2.1) * 0.45 + Math.sin(angle * 1.2) * 0.2;
        z = titleCenter.z + Math.sin(angle) * rz;
        yaw = -angle + Math.PI * 0.5;
      } else {
        // Left-to-right cinematic pass
        const t = (phase - 0.68) / 0.32;
        x = THREE.MathUtils.lerp(-12.5, 12.5, t);
        y = 1.0 + Math.sin(t * Math.PI) * 1.5 + Math.sin(elapsed * 2.3) * 0.15;
        z = THREE.MathUtils.lerp(2.8, -3.6, t);
        yaw = -Math.PI * 0.5 + Math.sin(t * Math.PI) * 0.35;
      }

      // Mouse influence (subtle follow)
      x += mouse.x * 0.95;
      y += mouse.y * 0.55;

      // Smoothly move and orient dragon
      dragonRig.position.set(x, y, z);
      dragonRig.rotation.y = THREE.MathUtils.lerp(dragonRig.rotation.y, yaw, 0.08);
      dragonRig.rotation.z = Math.sin(elapsed * 2.6) * 0.08;
      dragonRig.rotation.x = Math.sin(elapsed * 3.1) * 0.05;

      // Simulate wing flapping if no proper wing animation available
      const flap = Math.sin(elapsed * 9.0) * 0.32;
      if (wingBones.left && wingBones.right) {
        wingBones.left.forEach((bone) => {
          bone.rotation.z = THREE.MathUtils.lerp(bone.rotation.z, flap, 0.2);
        });
        wingBones.right.forEach((bone) => {
          bone.rotation.z = THREE.MathUtils.lerp(bone.rotation.z, -flap, 0.2);
        });
      }
    }

    function updateCamera(elapsed) {
      // Smooth mouse interpolation for camera parallax
      mouse.x = THREE.MathUtils.lerp(mouse.x, mouse.targetX, 0.05);
      mouse.y = THREE.MathUtils.lerp(mouse.y, mouse.targetY, 0.05);

      const baseX = Math.sin(elapsed * 0.22) * 0.45;
      const baseY = 1.35 + Math.sin(elapsed * 0.17) * 0.16;

      camera.position.x = baseX + mouse.x * 0.45;
      camera.position.y = baseY + mouse.y * 0.28;
      camera.position.z = 10.5 - mouse.y * 0.2;
      camera.lookAt(0, 1.0, 0);
    }

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();

      if (mixer) mixer.update(delta);

      updateDragonMotion(elapsed);
      updateCamera(elapsed);

      // Slow drift in particles for atmosphere
      particles.rotation.y += 0.00045;
      particles.rotation.x = Math.sin(elapsed * 0.08) * 0.04;

      renderer.render(scene, camera);
    }

    animate();

    // Responsive behavior
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
